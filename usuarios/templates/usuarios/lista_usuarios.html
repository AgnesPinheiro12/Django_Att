<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Lista de Usuários</title>
</head>
<body>
    <h1>Usuários da Biblioteca</h1>
    <table border="1" cellpadding="10">
        <tr>
            <th>Nome</th>
            <th>E-mail</th>
            <th>Telefone</th>
        </tr>
        {% for u in usuarios %}
        <tr>
            <td>{{ u.nome }}</td>
            <td>{{ u.email }}</td>
            <td>{{ u.telefone|default:"—" }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="3">Nenhum usuário registrado.</td>
        </tr>
        {% endfor %}
    </table>
    <p><a href="{% url 'emprestimos:relatorio_emprestimos' %}">Voltar ao início</a></p>
</body>
</html>
