<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Lista de Livros</title>
</head>
<body>
    <h1>Livros na Biblioteca</h1>
    <table border="1" cellpadding="10">
        <tr>
            <th>Título</th>
            <th>Autor</th>
            <th>ISBN</th>
            <th>Ano</th>
            <th>Disponível</th>
        </tr>
        {% for l in livros %}
        <tr>
            <td>{{ l.titulo }}</td>
            <td>{{ l.autor }}</td>
            <td>{{ l.isbn|default:"—" }}</td>
            <td>{{ l.ano_publicacao|default:"—" }}</td>
            <td>{% if l.esta_disponivel %}Sim{% else %}Não{% endif %}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="5">Nenhum livro registrado.</td>
        </tr>
        {% endfor %}
    </table>
    <p><a href="{% url 'emprestimos:relatorio_emprestimos' %}">Voltar ao início</a></p>
</body>
</html>
